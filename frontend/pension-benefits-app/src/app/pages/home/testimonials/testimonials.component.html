<section class="testimonials-section py-5 bg-light">
  <div class="container text-center">
    <h2 class="mb-5 fw-bold">Hear from Our Users</h2>

    <div id="testimonialCarousel"
         class="carousel slide"
         data-bs-ride="carousel"
         data-bs-interval="5000"
         data-bs-pause="hover">

      <div class="carousel-inner">

        <div class="carousel-item" *ngFor="let t of testimonials; let i = index" [class.active]="i === 0" data-aos="fade-up">
          <div class="testimonial-card mx-auto p-4 bg-white rounded shadow-sm" style="max-width: 650px;">
            <img [src]="t.photo"
                 alt="{{ t.name }}"
                 class="rounded-circle mb-3"
                 width="70"
                 height="70">
            <h5 class="mb-1">{{ t.name }}</h5>
            <div class="stars text-warning mb-2">
              <ng-container *ngFor="let star of [].constructor(t.rating)">
                <i class="bi bi-star-fill"></i>
              </ng-container>
            </div>
            <p class="fst-italic text-secondary">"{{ t.quote }}"</p>
          </div>
        </div>

      </div>

      <!-- Carousel Controls -->
      <button class="carousel-control-prev"
              type="button"
              data-bs-target="#testimonialCarousel"
              data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next"
              type="button"
              data-bs-target="#testimonialCarousel"
              data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

    </div>
  </div>
</section>
