<div class="container mt-5">
  <h3 class="mb-4 text-center">👤 Update Profile</h3>

  <form (ngSubmit)="updateProfile()" #profileForm="ngForm" class="card shadow-sm p-4">
    <div class="row g-3">
      <!-- NI Number -->
      <div class="col-md-6">
        <label for="niNumber" class="form-label">NI Number</label>
        <input type="text" id="niNumber" [(ngModel)]="profile.ni_number" name="ni_number" class="form-control" />
      </div>

      <!-- Date of Birth -->
      <div class="col-md-6">
        <label for="dob" class="form-label">Date of Birth</label>
        <input type="date" id="dob" [(ngModel)]="profile.date_of_birth" name="date_of_birth" class="form-control" />
      </div>

      <!-- Current Salary -->
      <div class="col-md-6">
        <label for="salary" class="form-label">Current Salary (£)</label>
        <input type="number" id="salary" [(ngModel)]="profile.current_salary" name="current_salary" class="form-control" />
      </div>

      <!-- Employment Status -->
      <div class="col-md-6">
        <label for="employmentStatus" class="form-label">Employment Status</label>
        <select id="employmentStatus" [(ngModel)]="profile.employment_status" name="employment_status" class="form-select">
          <option value="">Select Status</option>
          <option value="Active">Active</option>
          <option value="Retired">Retired</option>
        </select>
      </div>

      <!-- Investment Type -->
      <div class="col-md-6">
        <label for="investmentType" class="form-label">Investment Type</label>
        <select id="investmentType" [(ngModel)]="profile.investment_type" name="investment_type" class="form-select">
          <option value="">Select Investment Type</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <!-- Address -->
      <div class="col-md-6">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" [(ngModel)]="profile.address" name="address" class="form-control" />
      </div>

      <!-- Postal Code -->
      <div class="col-md-6">
        <label for="postalCode" class="form-label">Postal Code</label>
        <input type="text" id="postalCode" [(ngModel)]="profile.postal_code" name="postal_code" class="form-control" />
      </div>

      <!-- Contact Number -->
      <div class="col-md-6">
        <label for="contactNumber" class="form-label">Contact Number</label>
        <input type="text" id="contactNumber" [(ngModel)]="profile.contact_number" name="contact_number" class="form-control" />
      </div>
    </div>

    <!-- Submit Button -->
    <div class="mt-4 d-flex justify-content-between">
      <button class="btn btn-secondary" [routerLink]="['/dashboard']">
        ⬅️ Back
      </button>

      <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid">
        Update Profile
      </button>
    </div>
  </form>

  <div *ngIf="successMsg" class="alert alert-success mt-3 text-center">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger mt-3 text-center">{{ errorMsg }}</div>
</div>
