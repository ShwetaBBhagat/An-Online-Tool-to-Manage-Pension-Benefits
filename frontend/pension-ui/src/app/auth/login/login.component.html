<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      
      <div class="card shadow p-4">
        <h3 class="text-center mb-4">
          <span class="me-2">🔐</span> Employee Login
        </h3>

        <form (ngSubmit)="login()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              class="form-control"
              required
              placeholder="Enter your email"
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            
            <div class="input-group">
              <input 
                [type]="showPassword ? 'text' : 'password'" 
                id="password"
                [(ngModel)]="password"
                name="password"
                class="form-control"
                required
                placeholder="Enter your password"
              />
              <button 
                type="button" 
                class="btn btn-outline-secondary" 
                (click)="showPassword = !showPassword">
                {{ showPassword ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>


          <div class="mb-3">
            <label for="mfaToken" class="form-label">MFA Token (6-digit)</label>
            <input 
              type="text"
              id="mfaToken"
              [(ngModel)]="mfaToken"
              name="mfa_token"
              class="form-control"
              required
              minlength="6"
              maxlength="6"
              pattern="[0-9]*"
              placeholder="123456"
            />
          </div>

          <button 
            type="submit" 
            class="btn btn-primary w-100" 
            [disabled]="loginForm.invalid">
            Login
          </button>
        </form>
        <p class="mt-3 text-center">
          Forgot Password? <a [routerLink]="['/request-reset']" class="link-primary">Reset here</a>
        </p>
        
        <div *ngIf="successMsg" class="alert alert-success mt-3 text-center">
          {{ successMsg }}
        </div>
        <div *ngIf="errorMsg" class="alert alert-danger mt-3 text-center">
          {{ errorMsg }}
        </div>
      </div>

    </div>
  </div>
</div>
