<div class="container mt-5">
    <h3 class="mb-4 text-center">🔒 Reset Password</h3>
  
    <form (ngSubmit)="resetPassword()" #resetForm="ngForm" class="card shadow p-4">
  
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control" required minlength="8" />
      </div>
  
      <button class="btn btn-success w-100" [disabled]="resetForm.invalid">Reset Password</button>
    </form>
  
    <div *ngIf="successMsg" class="alert alert-success mt-3 text-center">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger mt-3 text-center">{{ errorMsg }}</div>
  </div>
