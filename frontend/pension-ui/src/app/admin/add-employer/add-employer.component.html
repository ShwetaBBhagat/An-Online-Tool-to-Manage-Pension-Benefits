<div class="container mt-5">
    <h3 class="mb-4 text-center">➕ Add New Employer</h3>
  
    <form (ngSubmit)="submitForm()" #employerForm="ngForm" class="card shadow p-4">
      <div class="mb-3">
        <label>Name <span class="text-danger">*</span></label>
        <input type="text" [(ngModel)]="employer.name" name="name" class="form-control" required />
      </div>
  
      <div class="mb-3">
        <label>Email <span class="text-danger">*</span></label>
        <input type="email" [(ngModel)]="employer.email" name="email" class="form-control" required />
      </div>
  
      <div class="mb-3">
        <label>Contact Number</label>
        <input type="text" [(ngModel)]="employer.contact_number" name="contact_number" class="form-control" />
      </div>
  
      <div class="mb-3">
        <label>Address</label>
        <textarea [(ngModel)]="employer.address" name="address" class="form-control"></textarea>
      </div>
  
      <button class="btn btn-primary w-100" [disabled]="employerForm.invalid">Add Employer</button>
    </form>
  
    <div *ngIf="successMsg" class="alert alert-success mt-3">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
  </div>
