<div class="container mt-5" style="max-width: 600px;">
  <h3 class="mb-4 text-center">➕ Add New Employer</h3>

  <form (ngSubmit)="submitForm()" #employerForm="ngForm" class="card shadow-sm p-4">
    <div class="mb-3">
      <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
      <input type="text" id="name" [(ngModel)]="employer.name" name="name" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
      <input type="email" id="email" [(ngModel)]="employer.email" name="email" class="form-control" required />
    </div>

    <div class="mb-3">
      <label for="contactNumber" class="form-label">Contact Number</label>
      <input type="text" id="contactNumber" [(ngModel)]="employer.contact_number" name="contact_number" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea id="address" [(ngModel)]="employer.address" name="address" rows="3" class="form-control"></textarea>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button type="button" class="btn btn-secondary" [routerLink]="['/admin/dashboard']">
        ⬅️ Back to Dashboard
      </button>

      <button type="submit" class="btn btn-primary" [disabled]="employerForm.invalid">
        ➕ Add Employer
      </button>
    </div>
  </form>

  <div *ngIf="successMsg" class="alert alert-success mt-3 text-center">
    {{ successMsg }}
  </div>
  <div *ngIf="errorMsg" class="alert alert-danger mt-3 text-center">
    {{ errorMsg }}
  </div>
</div>
