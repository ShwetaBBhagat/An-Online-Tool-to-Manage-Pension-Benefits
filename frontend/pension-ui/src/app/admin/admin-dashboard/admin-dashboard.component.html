<div class="container mt-5">
  <h2 class="text-center mb-4 text-primary">🛡️ Welcome, Admin</h2>

  <!-- Admin Actions -->
  <div class="d-flex justify-content-center flex-wrap gap-3 mb-5">
    <a routerLink="/admin/all-users" class="btn btn-outline-primary btn-lg">
      👥 View All Users
    </a>
    <a routerLink="/admin/view-employers" class="btn btn-outline-primary btn-lg">
      🏢 View Employers
    </a>
    <a routerLink="/admin/add-employer" class="btn btn-outline-success btn-lg">
      ➕ Add Employer
    </a>
  </div>

  <!-- Summary Cards -->
  <div class="row g-4">
    <div class="col-md-4 col-sm-6">
      <div class="card shadow-sm bg-primary text-white text-center p-3">
        <h5 class="card-title">Total Users</h5>
        <p class="card-text fs-3">{{ totalUsers }}</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card shadow-sm bg-success text-white text-center p-3">
        <h5 class="card-title">Total Employers</h5>
        <p class="card-text fs-3">{{ totalEmployers }}</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6">
      <div class="card shadow-sm bg-warning text-white text-center p-3">
        <h5 class="card-title">Documents Uploaded</h5>
        <p class="card-text fs-3">{{ totalDocuments }}</p>
      </div>
    </div>

    <div class="col-md-6 col-sm-6">
      <div class="card shadow-sm bg-info text-white text-center p-3">
        <h5 class="card-title">Pension Statements</h5>
        <p class="card-text fs-3">{{ totalStatements }}</p>
      </div>
    </div>

    <div class="col-md-6 col-sm-6">
      <div class="card shadow-sm bg-dark text-white text-center p-3">
        <h5 class="card-title">Total Pot Value</h5>
        <p class="card-text fs-3">£{{ totalPotValue | number:'1.2-2' }}</p>
      </div>
    </div>
  </div>

  <!-- Admin Dashboard Back and Logout -->
<div class="text-center mt-5">
  <button class="btn btn-danger" (click)="logoutAdmin()">
    🔒 Logout
  </button>
</div>

</div>
