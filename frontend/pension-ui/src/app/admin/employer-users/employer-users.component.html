<div class="container mt-4">
    <h3 class="mb-4 text-center">👥 Users under Employer #{{ employerId }}</h3>
  
    <div *ngIf="users.length === 0" class="text-muted text-center">
      No users found for this employer.
    </div>
  
    <div *ngIf="users.length > 0" class="table-responsive">
      <table class="table table-hover table-striped shadow-sm">
        <thead class="table-dark text-center">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>NI Number</th>
            <th>Salary (£)</th>
            <th>Investment Type</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.ni_number || '-' }}</td>
            <td>{{ user.salary }}</td>
            <td>{{ user.investment_type || '-' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
