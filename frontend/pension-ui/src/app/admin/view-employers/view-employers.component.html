<div class="container mt-5">
  <h3 class="text-center mb-5 text-primary">🏢 Registered Employers</h3>

  <!-- No Employers Found -->
  <div *ngIf="employers.length === 0" class="alert alert-info text-center">
    No employers found.
  </div>

  <!-- Employers Table -->
  <div *ngIf="employers.length > 0" class="table-responsive card shadow-sm p-3">
    <table class="table table-hover table-striped align-middle">
      <thead class="table-dark text-center">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Contact Number</th>
          <th>Address</th>
          <th>Registered On</th>
          <th>View Users</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let emp of employers; let i = index" class="text-center">
          <td>{{ i + 1 }}</td>
          <td>{{ emp.name }}</td>
          <td>{{ emp.email }}</td>
          <td>{{ emp.contact_number || '-' }}</td>
          <td>{{ emp.address || '-' }}</td>
          <td>{{ emp.created_at }}</td>
          <td>
            <a [routerLink]="['/admin/employers', emp.id, 'users']" class="btn btn-sm btn-outline-primary">
              👥 View Users
            </a>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteEmployer(emp.id)">
              🗑️ Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Back Button -->
  <div class="text-center mt-5">
    <button class="btn btn-secondary" [routerLink]="['/admin/dashboard']">
      ⬅️ Back to Dashboard
    </button>
  </div>
</div>
