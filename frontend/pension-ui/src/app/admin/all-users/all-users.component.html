<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary">
      <i class="fas fa-users me-2"></i>Registered Employees
    </h3>
  </div>

  <!-- Filters -->
  <form class="row g-3 align-items-end mb-4 filter-card shadow-sm p-4" (ngSubmit)="fetchUsers()">
    <div class="col-md-5">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="e.g. user@example.com" />
    </div>
    <div class="col-md-4">
      <label class="form-label fw-semibold">Profile Completed</label>
      <select class="form-select" [(ngModel)]="profileCompleted" name="profileCompleted">
        <option value="">-- All --</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-search me-2"></i>Search
      </button>
      <button type="button" class="btn btn-outline-secondary w-100" (click)="onResetFilters()">
        <i class="fas fa-undo-alt me-2"></i>Reset
      </button>
    </div>
  </form>

  <!-- Users Table -->
  <div class="card shadow-sm p-3 table-wrapper">
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle text-center">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>NI Number</th>
            <th>Profile</th>
            <th>Registered</th>
            <th>Statements</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td class="text-capitalize">{{ user.role }}</td>
            <td>{{ user.ni_number || '-' }}</td>
            <td>
              <span class="badge rounded-pill" [ngClass]="{
                'bg-success': user.profile_completed,
                'bg-secondary': !user.profile_completed
              }">
                {{ user.profile_completed ? 'Yes' : 'No' }}
              </span>
            </td>
            <td>{{ user.created_at }}</td>
            <td>
              <a [routerLink]="['/admin/users', user.id, 'statements']" class="btn btn-sm btn-outline-primary">
                <i class="fas fa-file-alt"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Back Button -->
  <div class="text-center mt-4">
    <button class="btn btn-secondary" [routerLink]="['/admin/dashboard']">
      <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
    </button>
  </div>
</div>
