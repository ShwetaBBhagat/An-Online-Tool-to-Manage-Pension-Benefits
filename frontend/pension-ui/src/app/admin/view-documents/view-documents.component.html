<div class="container mt-5">
  <h3 class="text-center mb-5 text-primary">📂 All Uploaded Documents</h3>

  <!-- Filters Form -->
  <form class="row g-3 mb-5 card shadow-sm p-4" (ngSubmit)="fetchDocuments()">
    <div class="col-md-3">
      <label>Email</label>
      <input [(ngModel)]="email" name="email" type="text" class="form-control" placeholder="user@example.com" />
    </div>

    <div class="col-md-2">
      <label>User ID</label>
      <input [(ngModel)]="userId" name="userId" type="number" class="form-control" />
    </div>

    <div class="col-md-3">
      <label>Start Date</label>
      <input [(ngModel)]="startDate" name="startDate" type="date" class="form-control" />
    </div>

    <div class="col-md-3">
      <label>End Date</label>
      <input [(ngModel)]="endDate" name="endDate" type="date" class="form-control" />
    </div>

    <div class="col-md-1 d-flex align-items-end">
      <button type="submit" class="btn btn-primary w-100">🔍 Search</button>
    </div>
  </form>

  <!-- No Data Message -->
  <div *ngIf="documents.length === 0" class="alert alert-info text-center">
    No documents found.
  </div>

  <!-- Documents Table -->
  <div *ngIf="documents.length > 0" class="table-responsive card shadow-sm p-3">
    <table class="table table-hover table-striped align-middle">
      <thead class="table-dark text-center">
        <tr>
          <th>ID</th>
          <th>Filename</th>
          <th>Uploaded At</th>
          <th>User Name</th>
          <th>User Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let doc of documents" class="text-center">
          <td>{{ doc.document_id }}</td>
          <td>{{ doc.filename }}</td>
          <td>{{ doc.uploaded_at }}</td>
          <td>{{ doc.user_name }}</td>
          <td>{{ doc.user_email }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Back Button -->
  <div class="text-center mt-5">
    <button class="btn btn-secondary" [routerLink]="['/admin/dashboard']">
      ⬅️ Back to Dashboard
    </button>
  </div>
</div>
