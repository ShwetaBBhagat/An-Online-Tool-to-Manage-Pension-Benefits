<div class="container mt-4">
    <h3 class="mb-4 text-center">📂 All Uploaded Documents</h3>
  
    <form class="row g-3 mb-4" (ngSubmit)="fetchDocuments()">
      <div class="col-md-3">
        <label>Email</label>
        <input [(ngModel)]="email" name="email" class="form-control" type="text" placeholder="user@example.com" />
      </div>
      <div class="col-md-2">
        <label>User ID</label>
        <input [(ngModel)]="userId" name="userId" class="form-control" type="number" />
      </div>
      <div class="col-md-3">
        <label>Start Date</label>
        <input [(ngModel)]="startDate" name="startDate" class="form-control" type="date" />
      </div>
      <div class="col-md-3">
        <label>End Date</label>
        <input [(ngModel)]="endDate" name="endDate" class="form-control" type="date" />
      </div>
      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Search</button>
      </div>
    </form>
  
    <div *ngIf="documents.length === 0" class="text-muted text-center">
      No documents found.
    </div>
  
    <div *ngIf="documents.length > 0" class="table-responsive">
      <table class="table table-striped table-hover shadow">
        <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>Uploaded At</th>
            <th>User Name</th>
            <th>User Email</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let doc of documents">
            <td>{{ doc.document_id }}</td>
            <td>{{ doc.filename }}</td>
            <td>{{ doc.uploaded_at }}</td>
            <td>{{ doc.user_name }}</td>
            <td>{{ doc.user_email }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
