<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">🔑 Set New Password</h3>

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        {{ loading ? 'Submitting...' : 'Reset Password' }}
      </button>
    </form>

    <div *ngIf="errorMsg" class="alert alert-danger text-center mt-3">
      {{ errorMsg }}
    </div>

    <div *ngIf="successMsg" class="alert alert-success text-center mt-3">
      {{ successMsg }}
    </div>
  </div>
</div>
