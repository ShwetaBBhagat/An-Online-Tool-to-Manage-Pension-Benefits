<div class="container mt-5">
    <h3 class="mb-4 text-center">🔐 Employer Login</h3>
  
    <form (ngSubmit)="onSubmit()" class="card shadow p-4" #loginForm="ngForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" required />
      </div>
  
      <div class="mb-3">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" required />
      </div>
  
      <button class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>
    </form>
  
    <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
  </div>
