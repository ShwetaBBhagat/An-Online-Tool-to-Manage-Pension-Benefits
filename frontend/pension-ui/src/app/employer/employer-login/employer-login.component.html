<div class="container mt-5" style="max-width: 480px;">
  <div class="card shadow-lg p-4 animate__animated animate__fadeIn">
    <div class="text-center mb-3">
      <i class="fas fa-building-lock fa-2x text-primary mb-2"></i>
      <h3 class="text-primary fw-bold">Employer Login</h3>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off" class="mt-3">
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-control"
          placeholder="employer@example.com"
          required
        />
      </div>

      <!-- Password with toggle -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <!-- MFA -->
      <div class="mb-3">
        <label for="mfaToken" class="form-label">MFA Token</label>
        <input
          type="text"
          id="mfaToken"
          [(ngModel)]="mfaToken"
          name="mfa_token"
          class="form-control"
          placeholder="Enter 6-digit code"
          pattern="[0-9]*"
          minlength="6"
          maxlength="6"
          required
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary w-100 mt-3"
        [disabled]="loginForm.invalid || loading"
      >
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </button>
      
    </form>

    <!-- Error Alert -->
    <div
      *ngIf="errorMsg"
      class="alert alert-danger mt-4 text-center animate__animated animate__fadeIn"
    >
      <i class="fas fa-exclamation-circle me-2"></i>{{ errorMsg }}
    </div>
  </div>
</div>
