<div class="container mt-5">
    <h3 class="mb-4 text-center">📄 Uploaded Documents by My Staff</h3>
  
    <div *ngIf="documents.length === 0" class="text-center text-muted">
      No documents uploaded by your users yet.
    </div>
  
    <div *ngIf="documents.length > 0" class="table-responsive">
      <table class="table table-striped table-hover shadow">
        <thead class="table-dark text-center">
          <tr>
            <th>#</th>
            <th>User ID</th>
            <th>Filename</th>
            <th>File Type</th>
            <th>Uploaded At</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let doc of documents; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ doc.user_id }}</td>
            <td>{{ doc.filename }}</td>
            <td>{{ doc.file_type }}</td>
            <td>{{ doc.uploaded_at }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <div *ngIf="errorMsg" class="alert alert-danger text-center mt-3">{{ errorMsg }}</div>
  </div>
