<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-center">🔐 Set Your Password</h3>

    <form (ngSubmit)="submitPassword()">
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" (input)="checkPasswordStrength()" required />
        <small *ngIf="passwordStrength" [ngClass]="{
          'text-danger': passwordStrength === 'Weak',
          'text-warning': passwordStrength === 'Medium',
          'text-success': passwordStrength === 'Strong'
        }">
          Password Strength: {{ passwordStrength }}
        </small>
      </div>

      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />
      </div>

      <button class="btn btn-primary w-100">Set Password</button>
    </form>

    <div *ngIf="successMsg" class="alert alert-success mt-3 text-center">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger mt-3 text-center">{{ errorMsg }}</div>
  </div>
</div>
