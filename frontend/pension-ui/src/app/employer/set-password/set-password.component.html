<div class="container mt-5">
    <h3 class="mb-4 text-center">🔐 Set Your Password</h3>
  
    <form (ngSubmit)="submitPassword()" #passwordForm="ngForm" class="card shadow p-4">
      <div class="mb-3">
        <label>New Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control" required minlength="6" />
      </div>
  
      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />
      </div>
  
      <button class="btn btn-primary w-100" [disabled]="passwordForm.invalid">Set Password</button>
    </form>
  
    <div *ngIf="successMsg" class="alert alert-success text-center mt-3">{{ successMsg }}</div>
    <div *ngIf="errorMsg" class="alert alert-danger text-center mt-3">{{ errorMsg }}</div>
  </div>
