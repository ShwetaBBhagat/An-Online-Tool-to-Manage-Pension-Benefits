<section class="faq-page">
  <h1 class="faq-title">{{ 'FAQ.TITLE' | translate }}</h1>
  <p class="faq-subtitle">{{ 'FAQ.SUBTITLE' | translate }}</p>

  <mat-accordion class="faq-accordion" multi>
    <mat-expansion-panel *ngFor="let faq of faqs">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ faq.question }}</mat-panel-title>
      </mat-expansion-panel-header>
      <p>{{ faq.answer }}</p>
    </mat-expansion-panel>
  </mat-accordion>
</section>
