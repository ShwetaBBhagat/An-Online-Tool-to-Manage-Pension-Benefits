<mat-toolbar>

  <span class="brand" routerLink="/">{{ 'NAV.BRAND' | translate }}</span>
  <span class="spacer"></span>

  <a mat-button routerLink="/">{{ 'NAV.HOME' | translate }}</a>
  <a mat-button routerLink="/about">{{ 'NAV.ABOUT' | translate }}</a>
  <a mat-button routerLink="/faq">{{ 'NAV.FAQ' | translate }}</a>
  <button mat-button routerLink="/auth/employee-login">{{ 'NAV.EMPLOYEE' | translate }}</button>
  <button mat-button routerLink="/employer/login">{{ 'NAV.EMPLOYER' | translate }}</button>
  <button mat-button routerLink="/admin/login">{{ 'NAV.ADMIN' | translate }}</button>

  <!-- Language Switcher Dropdown -->
  <select class="lang-dropdown"
          [(ngModel)]="selectedLang"
          (change)="changeLang($event)">
    <option value="en">English</option>
    <option value="hin">हिन्दी</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="pl">Polski</option>
  </select>

</mat-toolbar>
